# The fleet the pilot watches. One block per deployed app.
# `manifest` + `root` point at the app's sconix.yaml — the source of truth for
# what `restart` / `deploy` / `rollback` actually run.
# `rollback_to` (optional): the release id `pilot watch --allow-rollback` proposes
# rolling back to once a restart can't recover the app.
targets:
  - name: relnotes
    url: https://relnotes.204-168-172-115.sslip.io
    manifest: ~/systems/apps/relnotes/sconix.yaml
    root: ~/systems/apps/relnotes
    # rollback_to: <last-known-good release id>
  - name: skillforge
    url: https://skillforge.204-168-172-115.sslip.io
    manifest: ~/systems/apps/skillforge/sconix.yaml
    root: ~/systems/apps/skillforge
