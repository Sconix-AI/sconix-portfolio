version: "3"

tasks:
  setup:
    desc: install deps into a local venv
    cmds:
      - uv sync

  pilot:
    desc: "probe the fleet and have the agent assess it (pass -- <name> for one)"
    cmds:
      - uv run python -m pilot.run {{.CLI_ARGS}}

  drill:
    desc: "run the fake app; toggle with: task drill -- wedged | down | degraded | heal"
    cmds:
      - uv run python -m pilot.drill {{.CLI_ARGS | default "serve"}}

  demo:
    desc: "end-to-end: wedge the drill app, watch the agent restart it, then watch the gate refuse a 2nd"
    cmds:
      - uv run python -m pilot.demo

  test:
    cmds:
      - uv run pytest

  lint:
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
